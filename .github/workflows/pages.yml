name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static app
        run: npm run build --workspace=@tm/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AUTH_MODE: static
          # Optional: set a repository variable GOOGLE_CLIENT_ID to bake the client ID in.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Add 404 fallback for SPA routes
        run: cp packages/web/dist/index.html packages/web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository's Pages source is still "Deploy from a branch", GitHub also runs its
      # own Jekyll build of main on every push and it would overwrite this deployment. Waiting
      # lets ours land last. Harmless (and removable) once Settings → Pages → Source = GitHub Actions.
      - name: Wait for the legacy branch build to finish
        run: sleep 90
      - id: deployment
        uses: actions/deploy-pages@v4
